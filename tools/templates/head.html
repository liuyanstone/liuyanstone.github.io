  <style>
__FONTFACE__
    /* ============ tokens ============ */
    :root {
      --navy:      #1a3a5c;
      --navy-lift: #2a5a8c;
      --gold:      #c8a45a;
      --ink:       #12263a;
      --body:      #2d3748;
      --muted:     #5f7186;
      --faint:     #8598ad;
      --bg:        #f6f8fb;
      --surface:   #ffffff;
      --surface-2: #eef3f8;
      --border:    #dde5ee;
      --border-str:#c3d1e0;

      /* evidence-tier semantics — deliberately separate from the gold accent */
      --t-rct:         #0f766e;
      --t-quasi:       #2563a8;
      --t-structural:  #6d5b9e;
      --t-descriptive: #a97142;
      --t-review:      #55677a;

      --t-rct-bg:         #e2f2ef;
      --t-quasi-bg:       #e4eefa;
      --t-structural-bg:  #eee9f6;
      --t-descriptive-bg: #f6ece2;
      --t-review-bg:      #e9edf1;

      --shadow-sm: 0 1px 2px rgba(18,38,58,.06), 0 1px 3px rgba(18,38,58,.05);
      --shadow-md: 0 4px 16px rgba(18,38,58,.08);

      --display: 'Playfair Display', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --mono: ui-monospace, 'SFMono-Regular', 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;

      --maxw: 1240px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --navy:      #8fb4d9;
        --navy-lift: #a9c8e6;
        --gold:      #d8b978;
        --ink:       #eaf1f8;
        --body:      #ccd9e6;
        --muted:     #94a8bd;
        --faint:     #71879e;
        --bg:        #0d1620;
        --surface:   #14202c;
        --surface-2: #1b2939;
        --border:    #263749;
        --border-str:#354a61;

        --t-rct:         #5fc9b6;
        --t-quasi:       #6fa9e6;
        --t-structural:  #ac96e0;
        --t-descriptive: #d9a273;
        --t-review:      #93a7bb;

        --t-rct-bg:         #113630;
        --t-quasi-bg:       #14293f;
        --t-structural-bg:  #241f38;
        --t-descriptive-bg: #33251a;
        --t-review-bg:      #1d2833;

        --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
        --shadow-md: 0 4px 18px rgba(0,0,0,.45);
      }
    }
    :root[data-theme="dark"] {
      --navy:#8fb4d9; --navy-lift:#a9c8e6; --gold:#d8b978; --ink:#eaf1f8; --body:#ccd9e6;
      --muted:#94a8bd; --faint:#71879e; --bg:#0d1620; --surface:#14202c; --surface-2:#1b2939;
      --border:#263749; --border-str:#354a61;
      --t-rct:#5fc9b6; --t-quasi:#6fa9e6; --t-structural:#ac96e0; --t-descriptive:#d9a273; --t-review:#93a7bb;
      --t-rct-bg:#113630; --t-quasi-bg:#14293f; --t-structural-bg:#241f38; --t-descriptive-bg:#33251a; --t-review-bg:#1d2833;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 4px 18px rgba(0,0,0,.45);
    }
    :root[data-theme="light"] {
      --navy:#1a3a5c; --navy-lift:#2a5a8c; --gold:#c8a45a; --ink:#12263a; --body:#2d3748;
      --muted:#5f7186; --faint:#8598ad; --bg:#f6f8fb; --surface:#ffffff; --surface-2:#eef3f8;
      --border:#dde5ee; --border-str:#c3d1e0;
      --t-rct:#0f766e; --t-quasi:#2563a8; --t-structural:#6d5b9e; --t-descriptive:#a97142; --t-review:#55677a;
      --t-rct-bg:#e2f2ef; --t-quasi-bg:#e4eefa; --t-structural-bg:#eee9f6; --t-descriptive-bg:#f6ece2; --t-review-bg:#e9edf1;
      --shadow-sm:0 1px 2px rgba(18,38,58,.06),0 1px 3px rgba(18,38,58,.05); --shadow-md:0 4px 16px rgba(18,38,58,.08);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    /* Root sizing drives the whole dashboard: content is sized in rem, so raising this
       enlarges every table, chip, card and finding proportionally. The masthead/hero below
       pins its own sizes in px so the heading stays put while the dashboard grows. */
    html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; text-size-adjust:100%; font-size: 18px; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--body);
      line-height: 1.62;
      font-size: 1rem;
      overflow-x: hidden;
    }
    a { color: var(--navy); }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 3px; }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }
    }

    .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 1.5rem; }

    /* ============ masthead ============ */
    .masthead {
      background: linear-gradient(160deg, var(--navy) 0%, #14304c 55%, #102538 100%);
      color: #eef4fa;
      padding: 2.6rem 0 3.6rem;
      border-bottom: 3px solid var(--gold);
      position: relative;
    }
    :root[data-theme="dark"] .masthead,
    .masthead { }
    @media (prefers-color-scheme: dark) {
      .masthead { background: linear-gradient(160deg, #16283a 0%, #101f2e 55%, #0c1825 100%); }
    }
    :root[data-theme="dark"] .masthead { background: linear-gradient(160deg,#16283a 0%,#101f2e 55%,#0c1825 100%); }
    :root[data-theme="light"] .masthead { background: linear-gradient(160deg,#1a3a5c 0%,#14304c 55%,#102538 100%); }

    /* Hero text is pinned in px so it is unaffected by the root-size increase above. */
    .eyebrow {
      font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
      color: var(--gold); font-weight: 600; margin-bottom: .7rem;
    }
    .masthead h1 {
      font-family: var(--display);
      font-size: clamp(30px, 4.2vw, 48px);
      line-height: 1.12; font-weight: 700; color: #fff;
      text-wrap: balance; margin-bottom: .7rem; letter-spacing: -.01em; overflow-wrap: break-word;
    }
    .lede {
      max-width: 68ch; color: #c2d4e6; font-size: 16px; line-height: 1.65;
    }
    .masthead-meta {
      margin-top: 1.4rem; display:flex; flex-wrap:wrap; gap:.5rem 1.6rem;
      font-size: 12.5px; color: #9fb8cf;
    }
    .masthead-meta a { color:#cfe0ef; text-decoration: underline; text-underline-offset: 2px; }
    .home-link {
      position:absolute; top:1.1rem; right:1.5rem; display:flex; gap:.5rem; align-items:center;
    }
    .home-link a, .theme-btn {
      font-size:12px; color:#cfe0ef; text-decoration:none; border:1px solid rgba(255,255,255,.28);
      padding:.32rem .7rem; border-radius:999px; background:rgba(255,255,255,.06);
      cursor:pointer; font-family:var(--sans); transition: background .2s, border-color .2s;
    }
    @media (hover: hover) { .home-link a:hover, .theme-btn:hover { background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.5); } }

    /* ============ stat strip ============ */
    .stats {
      display:grid; grid-template-columns: repeat(auto-fit, minmax(132px,1fr));
      gap:1px; background: var(--border); border:1px solid var(--border);
      border-radius:10px; overflow:hidden; margin: -2rem 0 2.2rem; box-shadow: var(--shadow-md);
      position: relative; z-index: 3;
    }
    .stat { background: var(--surface); padding: .95rem 1.1rem; }
    .stat .n {
      font-family: var(--mono); font-size: 1.5rem; font-weight: 600; color: var(--ink);
      line-height:1.1; font-variant-numeric: tabular-nums; letter-spacing:-.02em;
    }
    .stat .l { font-size:.7rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin-top:.3rem; font-weight:500; }

    /* ============ section headings ============ */
    section { margin-bottom: 2.6rem; }
    .sec-head { display:flex; align-items:baseline; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin-bottom:.35rem; }
    h2.sec-title {
      font-family: var(--display); font-size: 1.4rem; font-weight:700; color: var(--ink);
      letter-spacing:-.01em;
    }
    .sec-note { font-size:.82rem; color: var(--muted); max-width: 70ch; margin-bottom: 1rem; }

    /* ============ matrix ============ */
    .matrix-scroll { overflow-x:auto; border:1px solid var(--border); border-radius:10px; background:var(--surface); box-shadow:var(--shadow-sm); }
    table.matrix { border-collapse: separate; border-spacing:0; width:100%; min-width: 860px; font-size:.8rem; }
    table.matrix th, table.matrix td { padding:0; }
    table.matrix td { height:1px; border-bottom:1px solid var(--border); border-right:1px solid var(--border); }
    table.matrix thead th {
      position:-webkit-sticky; position:sticky; top:0; background:var(--surface-2); z-index:2;
      font-size:.68rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;
      padding:.7rem .45rem; text-align:center; border-bottom:1px solid var(--border-str);
      vertical-align:bottom; line-height:1.25;
    }
    table.matrix thead th:first-child { text-align:left; padding-left:.9rem; z-index:3; left:0; }
    table.matrix tbody th {
      text-align:left; font-weight:500; font-size:.8rem; color:var(--ink);
      padding:.5rem .9rem .5rem .9rem; border-bottom:1px solid var(--border);
      background:var(--surface); position:-webkit-sticky; position:sticky; left:0; z-index:1; min-width:200px;
      border-right:1px solid var(--border);
    }
    @media (hover: hover) { table.matrix tbody tr:hover th { background: var(--surface-2); } }
    .cell {
      width:100%; height:100%; min-height:3.1rem; border:0; border-radius:0; -webkit-appearance:none; appearance:none;
      background: transparent; cursor:pointer; font-family:var(--mono); font-variant-numeric:tabular-nums;
      padding:.5rem .3rem; text-align:center; color:var(--ink); font-size:.82rem; line-height:1.25;
      transition: box-shadow .12s; display:block;
    }
    .cell:disabled { cursor:default; color:var(--faint); }
    .cell .tot { font-weight:600; }
    .cell .caus { display:block; font-size:.6rem; color:var(--muted); font-family:var(--sans); letter-spacing:.02em; }
    .cell.deep .tot { color:#fff; }
    .cell.deep .caus { color:rgba(255,255,255,.88); }
    @media (hover: hover) { .cell:not(:disabled):hover { box-shadow: inset 0 0 0 2px var(--gold); } }
    .cell.on { box-shadow: inset 0 0 0 2px var(--navy); }
    .matrix-legend { display:flex; align-items:center; gap:.6rem; margin-top:.7rem; font-size:.72rem; color:var(--muted); flex-wrap:wrap; }
    .ramp { display:flex; }
    .ramp i { width:22px; height:11px; display:block; border:1px solid var(--border); border-left:0; }
    .ramp i:first-child { border-left:1px solid var(--border); }

    /* ============ category of evidence: shape markers ============
       Shapes, not colours, so the category never competes with the evidence-strength colours. */
    .lv-mark { display:inline-block; width:.62em; height:.62em; margin-right:.45em; background:currentColor; vertical-align:.02em; flex:none; }
    .lv-mark[data-l="policy"]     { border-radius:1.5px; }
    .lv-mark[data-l="investment"] { width:.72em; -webkit-clip-path:polygon(50% 0, 100% 100%, 0 100%); clip-path:polygon(50% 0, 100% 100%, 0 100%); }
    .lv-mark[data-l="adoption"]   { border-radius:50%; }

    /* switch above the matrix */
    .lever-switch {
      display:flex; flex-wrap:wrap; width:fit-content; max-width:100%; margin:.25rem 0 .5rem;
      border:1px solid var(--border-str); border-radius:9px; overflow:hidden; background:var(--surface); box-shadow:var(--shadow-sm);
    }
    .seg {
      font-family:var(--sans); font-size:.8rem; padding:.52rem .95rem; border:0; border-right:1px solid var(--border);
      background:transparent; color:var(--body); cursor:pointer; display:inline-flex; align-items:center; white-space:nowrap;
    }
    .seg:last-child { border-right:0; }
    @media (hover: hover) { .seg:hover { background:var(--surface-2); color:var(--navy); } }
    .seg .lv-mark { color:var(--navy); }
    .seg.on { background:var(--navy); color:#fff; font-weight:600; }
    .seg.on .lv-mark { color:inherit; }
    @media (prefers-color-scheme: dark) { .seg.on { color:#0d1620; } }
    :root[data-theme="dark"] .seg.on { color:#0d1620; }
    :root[data-theme="light"] .seg.on { color:#fff; }
    .matrix-scope { font-size:.74rem; color:var(--muted); margin:0 0 .55rem; }
    .matrix-hint { display:none; font-size:.72rem; color:var(--muted); margin:-.2rem 0 .45rem; }
    .matrix-scope b { font-family:var(--mono); color:var(--ink); font-weight:600; }

    /* ============ evidence summary ============ */
    .sum-toggle {
      font-family:var(--sans); font-size:.76rem; padding:.38rem .8rem; border-radius:7px; cursor:pointer;
      border:1px solid var(--border-str); background:var(--surface); color:var(--navy);
    }
    @media (hover: hover) { .sum-toggle:hover { background:var(--surface-2); border-color:var(--navy); } }
    .sum-list { display:flex; flex-direction:column; gap:.55rem; }
    details.sum { background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-sm); }
    details.sum[open] { border-color:var(--border-str); box-shadow:var(--shadow-md); }
    details.sum > summary { display:block; list-style:none; cursor:pointer; padding:.85rem 1.1rem; }
    details.sum > summary::marker { content:''; }
    .sum-head { display:grid; grid-template-columns:1rem minmax(0,1fr) auto; gap:.15rem .75rem; align-items:baseline; }
    details.sum > summary::-webkit-details-marker { display:none; }
    .sum-head::before {
      content:''; width:.45rem; height:.45rem; justify-self:center; align-self:center;
      border-right:2px solid var(--muted); border-bottom:2px solid var(--muted);
      transform:rotate(-45deg); transition:transform .15s;
    }
    details.sum[open] .sum-head::before { transform:rotate(45deg); }
    @media (hover: hover) { details.sum > summary:hover .sum-title { color:var(--navy-lift); } }
    .sum-title { font-family:var(--display); font-size:1.08rem; font-weight:700; color:var(--ink); line-height:1.3; }
    .sum-stats { font-family:var(--mono); font-size:.72rem; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
    .sum-stats b { color:var(--ink); font-weight:600; }
    .sum-headline { grid-column:2 / 4; font-size:.86rem; color:var(--body); line-height:1.58; margin-top:.2rem; max-width:96ch; }
    .sum-body {
      display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:1.1rem 1.8rem;
      padding:.95rem 1.2rem 1.1rem 2.85rem; border-top:1px dashed var(--border);
    }
    .sum-side { display:flex; flex-direction:column; gap:1.1rem; }
    .sum-block h4 {
      font-size:.66rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:700; margin-bottom:.5rem;
    }
    .sum-block ul { list-style:none; display:flex; flex-direction:column; gap:.55rem; }
    .sum-block li { font-size:.84rem; line-height:1.62; color:var(--body); padding-left:1rem; position:relative; }
    .sum-block li::before {
      content:''; position:absolute; left:0; top:.62em; width:.38rem; height:.38rem; border-radius:50%; background:var(--border-str);
    }
    .sum-block.findings li::before { background:var(--gold); }
    .sum-block.gaps li::before { background:transparent; border:1.5px solid var(--muted); width:.34rem; height:.34rem; }
    a.cite-link {
      color:var(--navy-lift); text-decoration:underline; text-decoration-color:var(--border-str);
      text-underline-offset:2px; font-weight:500;
    }
    @media (hover: hover) { a.cite-link:hover { text-decoration-color:var(--navy-lift); } }
    .sum-foot {
      grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:.6rem 1.2rem;
      border-top:1px solid var(--border); padding-top:.8rem;
    }
    .sum-levers { font-size:.74rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:.3rem 1rem; }
    .sum-levers span { display:inline-flex; align-items:center; }
    .sum-levers .lv-mark { color:var(--navy); }
    .sum-levers b { font-family:var(--mono); color:var(--ink); margin-left:.35rem; font-weight:600; }
    .sum-show {
      margin-left:auto; font-family:var(--sans); font-size:.78rem; padding:.42rem .85rem; border-radius:7px; cursor:pointer;
      border:1px solid var(--navy); background:transparent; color:var(--navy);
    }
    @media (hover: hover) { .sum-show:hover { background:var(--navy); color:#fff; } }
    @media (prefers-color-scheme: dark) and (hover: hover) { .sum-show:hover { color:#0d1620; } }
    @media (hover: hover) { :root[data-theme="dark"] .sum-show:hover { color:#0d1620; } }
    @media (hover: hover) { :root[data-theme="light"] .sum-show:hover { color:#fff; } }

    /* ============ controls ============ */
    .controls { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1.05rem 1.15rem; box-shadow:var(--shadow-sm); }
    .ctl-row + .ctl-row { margin-top:.9rem; padding-top:.9rem; border-top:1px dashed var(--border); }
    .ctl-label { font-size:.66rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:600; margin-bottom:.5rem; display:block; }
    .chips { display:flex; flex-wrap:wrap; gap:.4rem; }
    .chip {
      font-family:var(--sans); font-size:.76rem; padding:.3rem .68rem; border-radius:999px;
      border:1px solid var(--border-str); background:var(--surface); color:var(--body);
      cursor:pointer; transition: all .15s; line-height:1.4; white-space:nowrap;
    }
    @media (hover: hover) { .chip:hover { border-color:var(--navy); color:var(--navy); } }
    .chip .c { font-family:var(--mono); font-size:.68rem; color:var(--faint); margin-left:.35rem; font-variant-numeric:tabular-nums; }
    .chip.on { background:var(--navy); border-color:var(--navy); color:#fff; font-weight:500; }
    :root[data-theme="dark"] .chip.on, .chip.on { }
    @media (prefers-color-scheme: dark) { .chip.on { color:#0d1620; } }
    :root[data-theme="dark"] .chip.on { color:#0d1620; }
    :root[data-theme="light"] .chip.on { color:#fff; }
    .chip.on .c { color: rgba(255,255,255,.7); }
    @media (prefers-color-scheme: dark) { .chip.on .c { color: rgba(13,22,32,.6); } }
    :root[data-theme="dark"] .chip.on .c { color: rgba(13,22,32,.6); }
    :root[data-theme="light"] .chip.on .c { color: rgba(255,255,255,.7); }

    .chip.tier { border-left-width:4px; }
    .chip.tier[data-t="rct"]        { border-left-color: var(--t-rct); }
    .chip.tier[data-t="quasi"]      { border-left-color: var(--t-quasi); }
    .chip.tier[data-t="structural"] { border-left-color: var(--t-structural); }
    .chip.tier[data-t="descriptive"]{ border-left-color: var(--t-descriptive); }
    .chip.tier[data-t="review"]     { border-left-color: var(--t-review); }
    .chip.lever-chip { display:inline-flex; align-items:center; }
    .chip.lever-chip .lv-mark { color:var(--navy); }
    .chip.lever-chip.on .lv-mark { color:inherit; }

    .search-row { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
    .search-box { flex:1 1 320px; position:relative; }
    .search-box input {
      width:100%; font-family:var(--sans); font-size:.88rem; padding:.55rem .8rem .55rem 2.1rem;
      border:1px solid var(--border-str); border-radius:8px; background:var(--surface); color:var(--body);
    }
    .search-box input::placeholder { color:var(--faint); }
    .search-box svg { position:absolute; left:.7rem; top:50%; transform:translateY(-50%); color:var(--faint); }
    select.sel {
      font-family:var(--sans); font-size:.82rem; padding:.55rem .7rem; border:1px solid var(--border-str);
      border-radius:8px; background:var(--surface); color:var(--body); cursor:pointer; max-width:210px;
    }
    .btn-reset {
      font-family:var(--sans); font-size:.78rem; padding:.55rem .9rem; border-radius:8px; cursor:pointer;
      border:1px solid var(--border-str); background:var(--surface-2); color:var(--muted);
    }
    @media (hover: hover) { .btn-reset:hover { color:var(--navy); border-color:var(--navy); } }

    /* ============ results ============ */
    .results-bar {
      display:flex; align-items:baseline; justify-content:space-between; gap:1rem; flex-wrap:wrap;
      margin:1.6rem 0 .9rem; padding-bottom:.6rem; border-bottom:2px solid var(--border-str);
    }
    .results-count { font-family:var(--display); font-size:1.15rem; color:var(--ink); font-weight:700; }
    .results-count span { font-family:var(--mono); font-variant-numeric:tabular-nums; }
    .active-filters { display:flex; gap:.35rem; flex-wrap:wrap; font-size:.74rem; align-items:center; }
    .afilter {
      background:var(--surface-2); border:1px solid var(--border); border-radius:999px;
      padding:.15rem .3rem .15rem .6rem; color:var(--muted); display:inline-flex; align-items:center; gap:.3rem;
    }
    .afilter button { border:0; background:transparent; cursor:pointer; color:var(--faint); font-size:.9rem; line-height:1; padding:0 .25rem; }
    @media (hover: hover) { .afilter button:hover { color:#c0392b; } }

    .cards { display:flex; flex-direction:column; gap:.85rem; }
    .card {
      background:var(--surface); border:1px solid var(--border); border-radius:10px;
      border-left:4px solid var(--t-descriptive); padding:1rem 1.15rem; box-shadow:var(--shadow-sm);
      transition: box-shadow .15s, transform .15s; overflow-wrap:break-word;
    }
    @media (hover: hover) { .card:hover { box-shadow: var(--shadow-md); } }
